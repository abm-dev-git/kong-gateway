# Railway configuration for Kong Gateway

[build]
dockerfilePath = "Dockerfile"

[deploy]
# /health is defined in kong.yml as a public (unauthenticated) route on
# abmdev-public, proxied through port 8000. Railway probes on the proxy port.
# If the backend is down, Kong will still respond to this route with a 502/504
# which Railway will treat as unhealthy — that is the intended behaviour; Kong
# cannot serve traffic without its upstream.
healthcheckPath = "/health"
healthcheckTimeout = 120

# Kong should always be running
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Kong needs more memory for 83+ routes
# Railway will auto-allocate, but Kong typically needs 1-2GB
