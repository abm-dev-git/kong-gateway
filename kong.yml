# ===========================================
# Global Plugins
# ===========================================
plugins:
  # CORS Plugin - Enable cross-origin requests from portal
  # Handles OPTIONS preflight requests automatically
  - name: cors
    tags:
      - cors
      - security
    config:
      origins:
        - https://dev.abm.dev
        - https://abm.dev
        - https://www.abm.dev
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-API-Key
        - x-api-key
        - x-org-id
        - x-correlation-id
      exposed_headers:
        - x-correlation-id
        - x-kong-request-id
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
      credentials: true
      max_age: 86400
      preflight_continue: false

  # Correlation ID for request tracing (all routes)
  # Generates unique ID for each request for distributed tracing
  - name: correlation-id
    tags:
      - tracing
      - correlation
    config:
      header_name: x-correlation-id
      generator: uuid#counter
      echo_downstream: true

  # Post-function plugin to set auth headers for backend gateway-trusted mode
  # Sets x-kong-* headers and x-org-id for backend authentication
  # Note: This runs after JWT/key-auth plugins validate the request
  # Related: kong-gateway#15, abm.dev-platform#231
  - name: post-function
    tags:
      - transformer
      - org-id
      - gateway-auth
    config:
      access:
        - |
          -- Set authentication headers for backend gateway-trusted mode
          -- Backend can trust these headers instead of re-validating

          -- Extract JWT claims and set headers
          local jwt_claims = kong.ctx.shared.authenticated_jwt_claims
          if jwt_claims then
            -- Set user ID from sub claim
            if jwt_claims.sub then
              kong.service.request.set_header("x-kong-jwt-claim-sub", jwt_claims.sub)
              kong.log.debug("Set x-kong-jwt-claim-sub: ", jwt_claims.sub)
            end

            -- Set org ID from o.id claim (Clerk format) or org_id
            if jwt_claims.o and jwt_claims.o.id then
              kong.service.request.set_header("x-kong-jwt-claim-org-id", jwt_claims.o.id)
              kong.service.request.set_header("x-org-id", jwt_claims.o.id)
              kong.log.debug("Set x-org-id from JWT o.id: ", jwt_claims.o.id)
            elseif jwt_claims.org_id then
              kong.service.request.set_header("x-kong-jwt-claim-org-id", jwt_claims.org_id)
              kong.service.request.set_header("x-org-id", jwt_claims.org_id)
              kong.log.debug("Set x-org-id from JWT org_id: ", jwt_claims.org_id)
            end

            -- Set email if present
            if jwt_claims.email then
              kong.service.request.set_header("x-kong-jwt-claim-email", jwt_claims.email)
              kong.log.debug("Set x-kong-jwt-claim-email: ", jwt_claims.email)
            end
          end

          -- Set consumer headers for all authenticated requests
          local consumer = kong.client.get_consumer()
          if consumer then
            -- Set consumer ID
            if consumer.id then
              kong.service.request.set_header("x-kong-consumer-id", consumer.id)
              kong.log.debug("Set x-kong-consumer-id: ", consumer.id)
            end

            -- Set consumer username
            if consumer.username then
              kong.service.request.set_header("x-kong-consumer-username", consumer.username)
              kong.log.debug("Set x-kong-consumer-username: ", consumer.username)
            end

            -- Fallback: set x-org-id from consumer custom_id if not already set
            -- FIX: Use kong.request.get_header() to read incoming headers (not kong.service.request.get_header)
            if consumer.custom_id and not kong.request.get_header("x-org-id") then
              kong.service.request.set_header("x-org-id", consumer.custom_id)
              kong.log.debug("Set x-org-id from consumer custom_id: ", consumer.custom_id)
            end

            -- Fallback: set x-kong-jwt-claim-sub from consumer username if not already set
            -- This allows API key auth to work for endpoints that require user context
            if consumer.username and not kong.request.get_header("x-kong-jwt-claim-sub") then
              -- Only set if username looks like a user ID (starts with "user_")
              if string.sub(consumer.username, 1, 5) == "user_" then
                kong.service.request.set_header("x-kong-jwt-claim-sub", consumer.username)
                kong.log.debug("Set x-kong-jwt-claim-sub from consumer username: ", consumer.username)
              end
            end
          end

  # JWT Authentication Plugin (for authenticated service only)
  # Uses anonymous consumer fallback for Either/Or auth pattern
  - name: jwt
    service: abmdev-backend
    tags:
      - authentication
      - jwt
    config:
      # Header locations to check for JWT
      header_names:
        - Authorization
      # Don't check URI params or cookies
      uri_param_names: []
      cookie_names: []
      # Claims to verify
      claims_to_verify:
        - exp
      # Key claim for identifying the issuer
      key_claim_name: iss
      # Not base64 encoded
      secret_is_base64: false
      # Run on preflight requests
      run_on_preflight: true
      # Anonymous consumer fallback (enables Either/Or auth)
      # If JWT validation fails, fall through to key-auth plugin
      anonymous: anonymous

  # ============================================================================
  # API KEY AUTH: Delegated to backend (Product Hunt launch 2026-04-20)
  # ============================================================================
  # The key-auth Kong plugin + request-termination plugin were REMOVED.
  # Reason: Kong runs DB-less here, so key-auth can only validate
  # credentials declared statically in kong.yml. Dynamic API keys created
  # via POST /v1/api-keys land in halo.api_keys but are invisible to Kong,
  # which caused 401s for every customer-created key.
  #
  # Backend is now the single source of truth for API key validation:
  #   - Shared.Authentication/Middleware/ApiKeyAuthenticationMiddleware.cs
  #   - Validates x-api-key / "Authorization: Bearer abmdev_*" against
  #     halo.api_keys via BCrypt. Rejects unknown / expired / revoked keys
  #     with 401.
  #
  # Kong still handles: TLS termination, routing, path rewriting, rate
  # limiting (per x-org-id), CORS, and JWT validation (for Clerk browser
  # traffic — so bad JWTs fail fast at the edge). The JWT plugin keeps its
  # `anonymous: anonymous` fallback — request rejection for truly-anonymous
  # traffic now happens inside the pre-function below (which has access to
  # every auth header, unlike request-termination).
  - name: pre-function
    service: abmdev-backend
    tags:
      - authentication
      - backend-delegated-auth
    config:
      access:
        - |
          -- Normalise API key location so the backend middleware always
          -- finds it on x-api-key (even if the client sent `apikey` or
          -- an `Authorization: Bearer abmdev_…` header).
          local api_key = kong.request.get_header("x-api-key")
          local apikey  = kong.request.get_header("apikey")
          local auth    = kong.request.get_header("Authorization")
          local has_bearer_apikey = false
          local has_bearer_jwt = false
          if auth and string.sub(auth, 1, 14) == "Bearer abmdev_" then
            has_bearer_apikey = true
          elseif auth and string.sub(auth, 1, 7) == "Bearer " then
            has_bearer_jwt = true
          end

          if (not api_key) and apikey then
            kong.service.request.set_header("x-api-key", apikey)
            api_key = apikey
          end
          if (not api_key) and has_bearer_apikey then
            kong.service.request.set_header("x-api-key", string.sub(auth, 8))
            api_key = "bearer-apikey"
            -- Strip the Bearer abmdev_ value from the Authorization
            -- header so Kong's JWT plugin does not try to validate it
            -- as a JWT (which it can never be). The backend still
            -- authenticates the request via x-api-key.
            kong.service.request.clear_header("Authorization")
          end

          -- Truly-anonymous request (no JWT and no API key of any form) →
          -- reject at the edge. Requests WITH an API key OR a Bearer JWT
          -- pass through; backend / JWT plugin validate.
          if (not api_key) and (not has_bearer_jwt) then
            return kong.response.exit(401, {
              message = "Authentication required. Provide JWT Bearer token or x-api-key header."
            })
          end

# ===========================================
# Rate Limiting Plugins
# ===========================================
# Rate limits are applied per org_id (from x-org-id header)
# Two tiers:
#   - Enrichment routes: 20 requests/minute (expensive operations)
#   - Standard routes: 100 requests/minute
#
# Rate limiting is applied via Admin API after startup using tags:
#   - Routes with tag 'rate-limit-enrichment' get 20/min
#   - Routes with tag 'rate-limit-standard' get 100/min
#
# Run: ./scripts/setup-rate-limiting.sh
#
# Note: Global rate-limit plugin below is a fallback for untagged routes

  # Global fallback rate limit (applies to all routes)
  # More specific rate limits are added via Admin API to tagged routes
  - name: rate-limiting
    tags:
      - rate-limiting
      - global
    config:
      # Default global limit
      minute: 1000
      # Rate-limit policy: 'local' (in-memory, per Kong instance).
      # Chosen for Product Hunt launch (2026-04-20): per-instance limits are
      # acceptable on day-1 because prod Kong runs as a single Railway replica.
      # Switch to 'redis' (KONG_REDIS_HOST/PORT env vars) once Redis service
      # is provisioned on Railway and scaling beyond one replica is needed.
      policy: local
      # Limit by x-org-id header (set by request-transformer in Issue #8)
      limit_by: header
      header_name: x-org-id
      # Return rate limit headers
      hide_client_headers: false
      # Count all response statuses
      fault_tolerant: true

# ===========================================
# Consumers
# ===========================================
consumers:
  # Anonymous consumer for fallback auth pattern
  # When both JWT and API-key auth fail, this consumer is used
  # Request Termination plugin (Issue #6) will reject these requests
  - username: anonymous
    custom_id: anonymous-fallback
    tags:
      - anonymous
      - fallback

  # Clerk JWT Consumer
  # JWTs from Clerk will be validated against this consumer
  - username: clerk-jwt
    custom_id: clerk-issuer
    tags:
      - clerk
      - jwt

# ===========================================
# JWT Secrets (Clerk JWKS Configuration)
# ===========================================
# Production issuer: https://abm.dev/api/clerk-proxy
#   Clerk prod runs in proxy mode — `frontend_api_url` and `proxy_url` both
#   resolve to https://abm.dev/api/clerk-proxy, so issued JWTs carry
#   iss="https://abm.dev/api/clerk-proxy". Kong's JWT plugin matches the
#   `key` field below against that `iss` claim (key_claim_name: iss), so
#   this MUST be the proxy URL, not the clerk.abm.dev CNAME host.
#   Verified via GET https://api.clerk.com/v1/domains (2026-04-19).
# Dev/staging issuer: https://magical-stag-51.clerk.accounts.dev
#
# The public key below was fetched from Clerk prod JWKS endpoint
# (kid: ins_36XBbvwAspqFqEPDfPQ85VOtySB) via the portal proxy route
# (https://abm.dev/api/clerk-proxy/.well-known/jwks.json) because clerk.abm.dev
# direct is currently orange-clouded in Cloudflare (Error 1000).
# Once clerk.abm.dev is grey-clouded, setup-jwt.sh can fetch the key directly
# on container startup as a runtime refresh. This declarative key is the
# source of truth for launch day.
jwt_secrets:
  # Clerk JWT Consumer Credentials - PRODUCTION
  - consumer: clerk-jwt
    key: "https://abm.dev/api/clerk-proxy"
